name: workouty-prod

services:
  db:
    image: postgres:18
    restart: unless-stopped
    # PowerSync replicates via the logical WAL; the default `replica` level is not enough.
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in your env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your env file}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in your env file}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ps-storage:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PS_STORAGE_USER:?set PS_STORAGE_USER in your env file}
      POSTGRES_PASSWORD: ${PS_STORAGE_PASSWORD:?set PS_STORAGE_PASSWORD in your env file}
      POSTGRES_DB: ${PS_STORAGE_DB:?set PS_STORAGE_DB in your env file}
    volumes:
      - ps_storage_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PS_STORAGE_USER} -d ${PS_STORAGE_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  powersync:
    image: herytz/workouty-powersync:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      ps-storage:
        condition: service_healthy
      # PowerSync reads the publication once, at startup, so booting before it exists means
      # replicating against nothing until manually restarted. `api` only reports healthy after
      # its entrypoint has applied the migrations and its bundled apps/api/sql/*.sql.
      api:
        condition: service_healthy
    command: ["start", "-r", "unified"]
    ports:
      - "${POWERSYNC_PORT:-6101}:8080"
    environment:
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml
      NODE_OPTIONS: --max-old-space-size=1000
      PS_DATA_SOURCE_URI: postgresql://${PS_REPLICATION_USER}:${PS_REPLICATION_PASSWORD}@db:5432/${POSTGRES_DB}
      PS_STORAGE_SOURCE_URI: postgresql://${PS_STORAGE_USER}:${PS_STORAGE_PASSWORD}@ps-storage:5432/${PS_STORAGE_DB}
      # Both databases are siblings on this private network, so `disable` is the default. Point
      # either URI at a managed Postgres and this must become verify-full. `!env` has no default
      # syntax, so every substituted variable must be supplied or the service refuses to start.
      PS_DATA_SOURCE_SSLMODE: ${PS_DATA_SOURCE_SSLMODE:-disable}
      PS_STORAGE_SOURCE_SSLMODE: ${PS_STORAGE_SOURCE_SSLMODE:-disable}
      PS_LOG_LEVEL: ${PS_LOG_LEVEL:-info}
      PS_JWKS_URL: http://api:3000/.well-known/jwks.json
      # Unset would resolve to an empty string, and `tokens: ['']` opens the admin API to a
      # bearer token of "".
      PS_ADMIN_TOKEN: ${PS_ADMIN_TOKEN:?generate one — see .env.prod.example}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/probes/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: herytz/workouty-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?generate one — see .env.prod.example}
      SMTP_URL: ${SMTP_URL:?set SMTP_URL to your mail relay — this stack has no built-in one}
      # Unset would mean "allow all" — the dev default.
      CORS_ORIGINS: ${PUBLIC_WEB_URL:?set PUBLIC_WEB_URL in your env file}
      APP_WEB_URL: ${PUBLIC_WEB_URL}
      # Read by the image's bundled powersync-role.sql, which the entrypoint runs after
      # migrating. Unset would create a role named "" and abort startup.
      PS_REPLICATION_USER: ${PS_REPLICATION_USER:?set PS_REPLICATION_USER in your env file}
      PS_REPLICATION_PASSWORD: ${PS_REPLICATION_PASSWORD:?set PS_REPLICATION_PASSWORD in your env file}
    ports:
      - "${API_PORT:-6100}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12

  # The API and PowerSync URLs the browser dials are inlined into this image's JS bundle at
  # build time, by the release workflow. Nothing set here can repoint them.
  web:
    image: herytz/workouty-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-6102}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  ps_storage_data:
