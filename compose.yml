name: workouty

services:
  db:
    image: postgres:18
    restart: unless-stopped
    # PowerSync replicates via the logical WAL; the default `replica` level is not enough.
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:6103:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ps-storage:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PS_STORAGE_USER}
      POSTGRES_PASSWORD: ${PS_STORAGE_PASSWORD}
      POSTGRES_DB: ${PS_STORAGE_DB}
    ports:
      - "127.0.0.1:6104:5432"
    volumes:
      - ps_storage_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PS_STORAGE_USER} -d ${PS_STORAGE_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  powersync:
    build:
      context: .
      dockerfile: apps/powersync/Dockerfile
    restart: unless-stopped
    depends_on:
      ps-storage:
        condition: service_healthy
      # PowerSync reads the publication once, at startup, so booting before it exists means
      # replicating against nothing until manually restarted. `api` only reports healthy after
      # its entrypoint has applied the migrations and apps/api/sql/*.sql, so this covers it.
      api:
        condition: service_healthy
    command: ["start", "-r", "unified"]
    ports:
      - "6101:8080"
    environment:
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml
      NODE_OPTIONS: --max-old-space-size=1000
      PS_DATA_SOURCE_URI: postgresql://${PS_REPLICATION_USER}:${PS_REPLICATION_PASSWORD}@db:5432/${POSTGRES_DB}
      PS_STORAGE_SOURCE_URI: postgresql://${PS_STORAGE_USER}:${PS_STORAGE_PASSWORD}@ps-storage:5432/${PS_STORAGE_DB}
      # Both databases are siblings on this private network. `!env` has no default syntax, so
      # every substituted variable must be supplied or the service refuses to start.
      PS_DATA_SOURCE_SSLMODE: ${PS_DATA_SOURCE_SSLMODE:-disable}
      PS_STORAGE_SOURCE_SSLMODE: ${PS_STORAGE_SOURCE_SSLMODE:-disable}
      PS_LOG_LEVEL: ${PS_LOG_LEVEL:-info}
      PS_JWKS_URL: http://api:3000/.well-known/jwks.json
      # Guarded even in dev: unset would resolve to an empty string, and `tokens: ['']` opens
      # the admin API to a bearer token of "".
      PS_ADMIN_TOKEN: ${PS_ADMIN_TOKEN:?set PS_ADMIN_TOKEN in .env — see .env.example}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/probes/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.30.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:6105:1025"
      - "127.0.0.1:6106:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8025 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      SMTP_URL: smtp://mailpit:1025
      # Read by apps/api/sql/powersync-role.sql, which the entrypoint runs after migrating.
      PS_REPLICATION_USER: ${PS_REPLICATION_USER}
      PS_REPLICATION_PASSWORD: ${PS_REPLICATION_PASSWORD}
    ports:
      - "127.0.0.1:6100:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  db_data:
  ps_storage_data:
